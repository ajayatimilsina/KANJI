<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT N4 Kanji - 5 Sec Flashcard</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            overflow: hidden;
        }

        #quiz-card {
            background: #16213e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 450px;
            text-align: center;
            border: 3px solid #0f3460;
        }

        .timer-bar-container {
            width: 100%;
            height: 10px;
            background: #0f3460;
            border-radius: 5px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background: #e94560;
            transition: width 1s linear;
        }

        .kanji-box {
            font-size: 160px;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 10px;
        }

        .answer-area {
            min-height: 130px;
        }

        .hiragana {
            font-size: 50px;
            color: #4ee44e;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }

        .nepali {
            font-size: 32px;
            color: #ffffff;
            opacity: 0;
            margin-top: 10px;
            font-style: italic;
        }

        .visible {
            opacity: 1;
        }

        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: #e94560;
            border: none;
            color: white;
            border-radius: 10px;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="quiz-card">
        <div class="timer-bar-container">
            <div id="timer-bar"></div>
        </div>
        
        <div class="kanji-box" id="kanji-display">飲</div>
        
        <div class="answer-area">
            <div id="hiragana-display" class="hiragana">のみます</div>
            <div id="nepali-display" class="nepali">पिउनु</div>
        </div>

        <button onclick="nextKanji()">अर्को (Next)</button>
    </div>

    <script>
        const kanjiList = [
            { k: "飲", h: "のみます", n: "पिउनु" },
            { k: "会", h: "あいます", n: "भेट्नु" },
            { k: "道", h: "みち", n: "बाटो" },
            { k: "足", h: "あし", n: "खुट्टा" },
            { k: "待", h: "まちます", n: "पर्खनु" },
            { k: "送", h: "おくります", n: "पठाउनु" },
            { k: "貸", h: "かします", n: "सापट दिनु" },
            { k: "借", h: "かります", n: "सापट लिनु" },
            { k: "始", h: "はじまります", n: "सुरु हुनु" },
            { k: "終", h: "おわります", n: "सकिनु" }
        ];

        let index = 0;
        let timer;
        let timeLeft = 5;

        function startChallenge() {
            timeLeft = 5;
            updateTimerBar();
            
            // लुकाउने
            document.getElementById('hiragana-display').classList.remove('visible');
            document.getElementById('nepali-display').classList.remove('visible');

            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                updateTimerBar();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    showResult();
                }
            }, 1000);
        }

        function updateTimerBar() {
            const bar = document.getElementById('timer-bar');
            const percentage = (timeLeft / 5) * 100;
            bar.style.width = percentage + "%";
        }

        function showResult() {
            document.getElementById('hiragana-display').classList.add('visible');
            document.getElementById('nepali-display').classList.add('visible');
        }

        function nextKanji() {
            index = (index + 1) % kanjiList.length;
            document.getElementById('kanji-display').innerText = kanjiList[index].k;
            document.getElementById('hiragana-display').innerText = kanjiList[index].h;
            document.getElementById('nepali-display').innerText = kanjiList[index].n;
            startChallenge();
        }

        window.onload = startChallenge;
    </script>
</body>
</html>
